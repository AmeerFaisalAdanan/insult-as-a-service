version: 2
updates:
  # Dev dependencies (the only dependencies this package has).
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    ignore:
      # TypeScript 7 is the native-port compiler; typescript-eslint and tsup do
      # not support it yet (typescript-eslint hard-errors on TS 7.0). Hold on the
      # 5.x line until the toolchain catches up; revisit manually.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        patterns:
          - '*'

  # Pinned GitHub Actions SHAs.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: ci
