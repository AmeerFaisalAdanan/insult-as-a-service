name: Release verification & publish

# Publication is GATED and disabled by default. The publish job runs only when:
#   - the push is a v* tag whose commit is on the protected `main` branch, AND
#   - the repository variable RELEASE_PUBLISH_ENABLED == 'true', AND
#   - the protected `release` environment's required reviewer approves, AND
#   - npm Trusted Publishing (OIDC) is configured for this repo.
# Until then, this workflow verifies a release end-to-end without publishing.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag commit is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag commit is not an ancestor of main. Refusing." >&2
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Mandatory checks
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run validate:roasts
      - name: Build from source
        run: npm run build
      - name: Verify package contents
        run: npm run verify:package
      - name: Consumer smoke test (clean install of packed tarball)
        run: |
          set -euo pipefail
          npm pack
          TARBALL="$(ls insult-as-a-service-*.tgz)"
          WORK="$(mktemp -d)"
          cp "$TARBALL" "$WORK/"
          cd "$WORK"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "./$TARBALL"
          cat > esm.mjs <<'EOF'
          import { createIaaS } from 'insult-as-a-service';
          const i = createIaaS({ enabled: true });
          if (i.message('X', 'invalid_email') === 'X') { throw new Error('ESM: not roasted'); }
          if (createIaaS({ enabled: false }).message('X', 'invalid_email') !== 'X') { throw new Error('ESM: disabled did not passthrough'); }
          console.log('ESM ok');
          EOF
          cat > cjs.cjs <<'EOF'
          const { createIaaS } = require('insult-as-a-service');
          const i = createIaaS({ enabled: true });
          if (i.message('X', 'invalid_email') === 'X') { throw new Error('CJS: not roasted'); }
          console.log('CJS ok');
          EOF
          node esm.mjs
          node cjs.cjs
      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-file sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json

  publish:
    name: Publish to npm (gated)
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # ONLY this job gets OIDC, for npm Trusted Publishing
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node (npm registry)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Build from source
        run: npm run build
      - name: Verify package contents
        run: npm run verify:package
      - name: Publish with provenance (npm Trusted Publishing / OIDC)
        run: npm publish --provenance --access public
      - name: Verify published version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Published ${PKG_VERSION}; verify provenance on the npm package page."
